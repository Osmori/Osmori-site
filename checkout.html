<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - OSMORI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #222;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: #fff;
            text-decoration: none;
        }
        .checkout-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 2rem;
            background: #111;
            border-radius: 12px;
            border: 1px solid #222;
            flex: 1;
        }
        h1 {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 2rem;
            color: #fff;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #aaa;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            background-color: #222;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #e0e0e0; /* New accent color */
        }
        .btn {
            width: 100%;
            padding: 1rem;
            background-color: #e0e0e0;
            color: #0a0a0a;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #c0c0c0;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #e0e0e0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #ff6b6b;
            margin: 1rem 0;
        }
        .hidden {
            display: none;
        }
        #payment-element {
            margin: 20px 0;
        }
        /* Style the Stripe element container */
        .StripeElement {
            background-color: #222 !important;
            padding: 1rem;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
        }
    </style>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
    <div class="navbar">
        <a href="/" class="logo">OSMORI</a>
    </div>

    <div class="checkout-container">
        <form id="payment-form">
            <div id="info-fields">
                <h1>Complete your order</h1>
                <div class="form-group">
                    <label>Full name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Email address</label>
                    <input type="email" id="email" required>
                </div>
                <button type="submit" class="btn" id="submit-button">Continue to payment</button>
                <div id="form-error" class="error hidden"></div>
            </div>
            <div id="payment-fields" class="hidden">
                <div id="payment-element">
                    <!-- Stripe Payment Element will be mounted here -->
                </div>
                <button type="submit" class="btn" id="pay-button">Pay now</button>
                <div id="payment-error" class="error hidden"></div>
            </div>
        </form>
        <div id="loading" class="loader hidden"></div>
    </div>

    <script>
        const stripe = Stripe('pk_test_51T3mRS2Hrf3rXY4aUwPXW4xqcTdI1JKgPb1UbIFSooACxCCAnzXXCkHJud6SWXjmwPyQTBRqtGvTErmpdogszXBL007Exzfqjl');
        const urlParams = new URLSearchParams(window.location.search);
        const priceId = urlParams.get('priceId');
        const productName = urlParams.get('product');

        if (!priceId) {
            document.querySelector('.checkout-container').innerHTML = '<p class="error">Missing product information. <a href="/" style="color:#e0e0e0;">Go back</a></p>';
        }

        let clientSecret = null;
        let elements = null;

        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!clientSecret) {
                // First step: collect name/email and create PaymentIntent
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();

                if (!name || !email) {
                    document.getElementById('form-error').textContent = 'Please fill in all fields.';
                    document.getElementById('form-error').classList.remove('hidden');
                    return;
                }

                // Show loading
                document.getElementById('info-fields').style.display = 'none';
                document.getElementById('loading').classList.remove('hidden');
                document.getElementById('form-error').classList.add('hidden');

                try {
                    // Call your backend to create a PaymentIntent
                    const response = await fetch('/api/create-payment-intent', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ priceId, customerEmail: email, customerName: name })
                    });

                    if (!response.ok) throw new Error('Server error');
                    const data = await response.json();
                    clientSecret = data.clientSecret;

                    // Hide loading, show payment fields
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('payment-fields').classList.remove('hidden');

                    // Initialize Elements with appearance
                    elements = stripe.elements({
                        clientSecret,
                        appearance: {
                            theme: 'night',
                            variables: {
                                colorPrimary: '#e0e0e0',
                                colorBackground: '#0a0a0a',
                                colorText: '#ffffff',
                                colorDanger: '#ff6b6b',
                                fontFamily: 'Inter, sans-serif',
                                borderRadius: '4px',
                                colorTextSecondary: '#aaaaaa'
                            },
                            rules: {
                                '.Input': {
                                    backgroundColor: '#222222',
                                    borderColor: '#333333',
                                    color: '#ffffff'
                                },
                                '.Input:focus': {
                                    borderColor: '#e0e0e0'
                                },
                                '.Label': {
                                    color: '#aaaaaa'
                                }
                            }
                        }
                    });

                    // Create and mount the Payment Element
                    const paymentElement = elements.create('payment');
                    paymentElement.mount('#payment-element');
                } catch (error) {
                    console.error(error);
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('info-fields').style.display = 'block';
                    document.getElementById('form-error').textContent = 'Error: ' + error.message;
                    document.getElementById('form-error').classList.remove('hidden');
                }
            } else {
                // Second step: confirm payment
                document.getElementById('pay-button').disabled = true;
                document.getElementById('payment-error').classList.add('hidden');

                const { error } = await stripe.confirmPayment({
                    elements,
                    confirmParams: {
                        return_url: 'https://osmori.com/return',
                    },
                });

                if (error) {
                    document.getElementById('payment-error').textContent = error.message;
                    document.getElementById('payment-error').classList.remove('hidden');
                    document.getElementById('pay-button').disabled = false;
                }
            }
        });
    </script>
</body>
</html>
